# https://render.com — New Blueprint → select repo with this file, or create Web Service manually.
services:
  - type: web
    name: election-results-viewer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    # Optional in Render dashboard (not here): GOOGLE_CSE_API_KEY, GOOGLE_CSE_CX for party images.
    envVars:
      - key: NODE_ENV
        value: production
